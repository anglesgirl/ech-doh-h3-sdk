name: Build ech-doh-h3-sdk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint and test
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      
      - name: Check formatting
        run: cargo fmt --check
      
      - name: Run clippy
        run: cargo clippy -- -D warnings
      
      - name: Run tests
        run: cargo test

  # Build for Android
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      
      - name: Install Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
      
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      
      - name: Setup OpenSSL for Android cross-compilation
        run: |
          # Install OpenSSL for Android cross-compilation
          sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
          # Set up environment for cross-compilation
          echo "OPENSSL_DIR=/usr/lib/ssl" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
      
      - name: Build for Android
        run: |
          for TARGET in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            cargo ndk --target "${TARGET}" -o target/android/jniLibs build --features uniffi_cli --release
          done
      
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-libs
          path: target/android/jniLibs/
          retention-days: 7

  # Build for iOS
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: lint-test
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios x86_64-apple-ios
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      
      - name: Set up iOS deployment target
        run: |
          echo "IPHONEOS_DEPLOYMENT_TARGET=13.0" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV
      
      - name: Install cargo-lipo
        run: cargo install cargo-lipo --locked
      
      - name: Build for iOS device
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=13.0
          cargo build --target aarch64-apple-ios --features uniffi_cli --release
      
      - name: Build for iOS simulator
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=13.0
          cargo build --target x86_64-apple-ios --features uniffi_cli --release
      
      - name: Create XCFramework
        run: |
          XCFRAMEWORK_PATH="${{ github.workspace }}/target/ios/ech_doh_h3_sdk.xcframework"
          rm -rf "${XCFRAMEWORK_PATH}"
          xcodebuild -create-xcframework \
            -library "${{ github.workspace }}/target/aarch64-apple-ios/release/libech_doh_h3_sdk.a" \
            -library "${{ github.workspace }}/target/x86_64-apple-ios/release/libech_doh_h3_sdk.a" \
            -output "${XCFRAMEWORK_PATH}"
      
      - name: Upload iOS XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: target/ios/ech_doh_h3_sdk.xcframework/
          retention-days: 7

  # Generate UniFFI Bindings
  generate-bindings:
    name: Generate UniFFI Bindings
    runs-on: ubuntu-latest
    needs: [lint-test, build-android]
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-libs
          path: target/android/jniLibs/
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      
      - name: Install uniffi-bindgen
        run: cargo install --git https://github.com/mozilla/uniffi-rs --branch main --features cli uniffi --locked
      
      - name: Build with uniffi_cli feature
        run: cargo build --features uniffi_cli --release
      
      - name: Generate Kotlin bindings
        run: |
          uniffi-bindgen generate target/android/jniLibs/arm64-v8a/libech_doh_h3_sdk.so \
            --language kotlin \
            --out-dir target/bindings/kotlin
      
      - name: Generate Swift bindings
        run: |
          uniffi-bindgen generate target/release/libech_doh_h3_sdk.dylib \
            --language swift \
            --out-dir target/bindings/swift
      
      - name: Upload Kotlin bindings
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-bindings
          path: target/bindings/kotlin/
          retention-days: 7
      
      - name: Upload Swift bindings
        uses: actions/upload-artifact@v4
        with:
          name: swift-bindings
          path: target/bindings/swift/
          retention-days: 7

  # Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, generate-bindings]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-libs
          path: target/android/jniLibs/
      
      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-xcframework
          path: target/ios/
      
      - name: Download Kotlin bindings
        uses: actions/download-artifact@v4
        with:
          name: kotlin-bindings
          path: target/bindings/kotlin/
      
      - name: Download Swift bindings
        uses: actions/download-artifact@v4
        with:
          name: swift-bindings
          path: target/bindings/swift/
      
      - name: Create release archives
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release
          
          # Android release
          cd target/android/jniLibs
          tar -czf "../../release/ech-doh-h3-sdk-${VERSION}-android.tar.gz" .
          cd ../..
          
          # iOS release
          cd target/ios
          tar -czf "../../release/ech-doh-h3-sdk-${VERSION}-ios-xcframework.tar.gz" .
          cd ../..
          
          # Bindings
          cd target/bindings/kotlin
          tar -czf "../../release/ech-doh-h3-sdk-${VERSION}-kotlin-bindings.tar.gz" .
          cd ../swift
          tar -czf "../../release/ech-doh-h3-sdk-${VERSION}-swift-bindings.tar.gz" .
          cd ../..
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ech-doh-h3-sdk-${{ github.ref_name }}-android.tar.gz
            release/ech-doh-h3-sdk-${{ github.ref_name }}-ios-xcframework.tar.gz
            release/ech-doh-h3-sdk-${{ github.ref_name }}-kotlin-bindings.tar.gz
            release/ech-doh-h3-sdk-${{ github.ref_name }}-swift-bindings.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}