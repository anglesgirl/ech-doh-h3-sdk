name: Build Pure Demo APK

on:
  push:
    branches: [main]
    paths:
      - 'ech-demo-pure/**'
      - '.github/workflows/android-demo-pure.yml'
  workflow_dispatch:

jobs:
  build-pure-demo:
    name: Build Pure Kotlin Demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        run: |
          cd ech-demo-pure
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ech-demo-pure-apk
          path: ech-demo-pure/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Notify build result
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/notify-build-result.sh
