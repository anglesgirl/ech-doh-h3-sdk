name: Build Android Demo APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_SDK_VERSION: 34
  ANDROID_NDK_VERSION: r26c
  ANDROID_BUILD_TOOLS_VERSION: 34.0.0

jobs:
  build-rust-sdk:
    name: Build Rust SDK + Kotlin Bindings
    runs-on: ubuntu-latest
    outputs:
      kotlin-bindings-path: ${{ steps.bindings.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Install cargo-ndk & uniffi-bindgen
        run: |
          cargo install cargo-ndk --locked
          cargo install --git https://github.com/mozilla/uniffi-rs --tag v0.28.0 uniffi --features bindgen --locked

      - name: Build SDK for Android
        run: |
          for TARGET in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            cargo ndk --target "${TARGET}" -o target/android/jniLibs build --release
          done

      - name: Build with uniffi_cli feature
        run: cargo build --features uniffi_cli

      - name: Generate Kotlin bindings
        id: bindings
        run: |
          cargo run --features uniffi_cli -- uniffi-bindgen generate src/lib.rs \
            --language kotlin \
            --out-dir target/bindings/kotlin
          echo "path=target/bindings/kotlin" >> $GITHUB_OUTPUT

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-android-libs
          path: |
            target/android/jniLibs/
            target/bindings/kotlin/
          retention-days: 7

  build-android-demo:
    name: Build Android Demo APK
    runs-on: ubuntu-latest
    needs: build-rust-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Download Rust artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-android-libs
          path: ech-demo/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          build-tools-version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}

      - name: Prepare Demo project
        run: |
          mkdir -p ech-demo/app/src/main/jniLibs/arm64-v8a
          mkdir -p ech-demo/app/src/main/jniLibs/armeabi-v7a
          mkdir -p ech-demo/app/src/main/jniLibs/x86_64
          mkdir -p ech-demo/app/src/main/java

          # 复制 .so
          cp -r ech-demo/jniLibs/* ech-demo/app/src/main/jniLibs/
          # 复制 Kotlin 绑定
          cp -r ech-demo/bindings/kotlin/com ech-demo/app/src/main/java/

      - name: Create Demo Gradle files
        run: |
          cat > ech-demo/settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { gradlePluginPortal() google() mavenCentral() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google() mavenCentral() }
          }
          rootProject.name = "EchDemo"
          include(":app")
          EOF

          cat > ech-demo/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat > ech-demo/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.echdemo"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.echdemo"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              sourceSets {
                  main {
                      jniLibs.srcDirs("src/main/jniLibs")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = "1.8" }
              buildFeatures { viewBinding = true }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

      - name: Create Demo source files
        run: |
          mkdir -p ech-demo/app/src/main/java/com/example/echdemo
          mkdir -p ech-demo/app/src/main/res/layout
          mkdir -p ech-demo/app/src/main/res/values

          # AndroidManifest.xml
          cat > ech-demo/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="ECH Demo"
                  android:theme="@style/Theme.EchDemo">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml
          cat > ech-demo/app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">ECH Demo</string>
          </resources>
          EOF

          # themes.xml
          cat > ech-demo/app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.EchDemo" parent="Theme.MaterialComponents.DayNight.DarkActionBar">
                  <item name="colorPrimary">#6200EE</item>
                  <item name="colorPrimaryVariant">#3700B3</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
              </style>
          </resources>
          EOF

          # activity_main.xml
          cat > ech-demo/app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="ECH + H3 测试工具"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:gravity="center"
                  android:layout_marginBottom="16dp"/>

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="域名 (例: cloudflare-ech.com)"
                  android:layout_marginBottom="4dp"/>

              <EditText
                  android:id="@+id/etDomain"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="cloudflare-ech.com"
                  android:inputType="textUri"
                  android:layout_marginBottom="12dp"/>

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="DoH 服务器 (可选，默认 1.1.1.1)"
                  android:layout_marginBottom="4dp"/>

              <EditText
                  android:id="@+id/etDohServer"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="https://1.1.1.1/dns-query"
                  android:inputType="textUri"
                  android:layout_marginBottom="16dp"/>

              <Button
                  android:id="@+id/btnTest"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="开始测试"
                  android:textSize="18sp"/>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="16dp">
                  <TextView
                      android:id="@+id/tvResult"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="点击按钮开始测试..."
                      android:textSize="13sp"
                      android:fontFamily="monospace"
                      android:padding="8dp"
                      android:background="#f5f5f5"/>
              </ScrollView>
          </LinearLayout>
          EOF

          # MainActivity.kt
          cat > ech-demo/app/src/main/java/com/example/echdemo/MainActivity.kt << 'EOF'
          package com.example.echdemo

          import android.os.Bundle
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.example.echdemo.databinding.ActivityMainBinding
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch

          class MainActivity : AppCompatActivity() {
              private lateinit var binding: ActivityMainBinding
              private val testRunner = EchTestRunner()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  binding.btnTest.setOnClickListener { runTest() }
              }

              private fun runTest() {
                  val domain = binding.etDomain.text.toString().trim()
                  val dohServer = binding.etDohServer.text.toString().trim()
                  if (domain.isEmpty()) { Toast.makeText(this, "请输入域名", Toast.LENGTH_SHORT).show(); return }

                  binding.tvResult.text = "测试中...\n域名: $domain\nDoH: ${if (dohServer.isEmpty()) "默认" else dohServer}"
                  binding.btnTest.isEnabled = false

                  lifecycleScope.launch(Dispatchers.IO) {
                      val result = testRunner.testDomain(domain, dohServer)
                      runOnUiThread {
                          binding.tvResult.text = result
                          binding.btnTest.isEnabled = true
                      }
                  }
              }
          }
          EOF

          # EchTestRunner.kt
          cat > ech-demo/app/src/main/java/com/example/echdemo/EchTestRunner.kt << 'EOF'
          package com.example.echdemo

          import com.ech_doh_h3_sdk.Engine
          import com.ech_doh_h3_sdk.EngineConfig
          import com.ech_doh_h3_sdk.HttpMethod
          import com.ech_doh_h3_sdk.HttpResponse
          import java.util.HashMap

          class EchTestRunner {
              private val engine: Engine by lazy {
                  val config = EngineConfig(
                      dohServer = "https://1.1.1.1/dns-query",
                      dohBootstrapIp = null,
                      connectTimeoutSecs = 10,
                      requestTimeoutSecs = 30,
                      enableH3 = true,
                      enableEch = true,
                      userAgent = "EchDemo/1.0",
                      verifyCertificates = true
                  )
                  Engine.new(config)!!
              }

              fun testDomain(domain: String, customDohServer: String): String {
                  val dohServer = if (customDohServer.isEmpty()) "https://1.1.1.1/dns-query" else customDohServer
                  val sb = StringBuilder().apply {
                      append("===== 测试结果 =====\n域名: $domain\nDoH: $dohServer\n\n")
                  }

                  val testEngine = if (customDohServer.isEmpty()) engine else Engine.new(EngineConfig(
                      dohServer = dohServer, dohBootstrapIp = null, connectTimeoutSecs = 10,
                      requestTimeoutSecs = 30, enableH3 = true, enableEch = true,
                      userAgent = "EchDemo/1.0", verifyCertificates = true
                  ))!!

                  val url = "https://$domain"
                  sb.append("--- HTTP/3 + ECH 测试 ---\n")
                  try {
                      val resp = testEngine.fetch(url, HttpMethod.GET, HashMap(), ByteArray(0))
                      sb.append("✅ 连接成功\n状态码: ${resp.statusCode}\n")
                      sb.append("协议: ${if (resp.headers["alt-svc"]?.contains("h3") == true) "HTTP/3" else "HTTP/1.x/2"}\n")
                      sb.append("ECH: ${if (resp.headers["alt-svc"]?.contains("h3") == true) "✅ 很可能生效" else "⚠️ 无法确定"}\n")
                      resp.headers.forEach { (k, v) -> sb.append("  $k: $v\n") }
                      sb.append("Body: ${resp.body.size} bytes\n")
                  } catch (e: Exception) {
                      sb.append("❌ 失败: ${e.message}\n类型: ${e.javaClass.simpleName}\n")
                  }

                  sb.append("\n--- 仅 HTTPS (H3关闭) ---\n")
                  try {
                      val fallback = Engine.new(EngineConfig(
                          dohServer = dohServer, dohBootstrapIp = null, connectTimeoutSecs = 10,
                          requestTimeoutSecs = 30, enableH3 = false, enableEch = true,
                          userAgent = "EchDemo/1.0", verifyCertificates = true
                      ))!!
                      val resp = fallback.fetch(url, HttpMethod.GET, HashMap(), ByteArray(0))
                      sb.append("✅ HTTPS OK\n状态码: ${resp.statusCode}\n")
                  } catch (e: Exception) {
                      sb.append("❌ HTTPS 也失败: ${e.message}\n")
                  }

                  if (customDohServer.isNotEmpty()) testEngine.shutdown()
                  sb.append("\n===== 结束 =====")
                  return sb.toString()
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd ech-demo
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ech-demo-apk
          path: ech-demo/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-android-demo
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ech-demo-apk
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}